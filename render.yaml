services:
  - type: web
    name: church-backend-api
    runtime: node
    rootDir: Backend         
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
    buildFilter:
      paths:
        - Backend/**         

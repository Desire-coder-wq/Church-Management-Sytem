name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'Backend/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'render.yaml'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'Backend/**'
              - '.github/workflows/**'
              - 'package.json'
              - 'package-lock.json'
              - 'render.yaml'

  backend-verify:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install deps
        working-directory: Backend        # ← Capital B
        run: npm ci
      - name: Generate Prisma client
        working-directory: Backend
        run: npx prisma generate
      - name: Lint & Test
        working-directory: Backend
        run: |
          npm run lint
          npm run test
          npm run build

  backend-e2e:
    needs: backend-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup & Run E2E
        working-directory: Backend
        run: |
          npm ci
          npx prisma generate
          npm run test:e2e

  backend-deploy:
    needs: backend-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
